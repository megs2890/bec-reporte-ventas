<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reporte de ventas BEC</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#222;color:#FAFAF8;font-family:Arial,Helvetica,sans-serif}
form{width:min(340px,86vw);background:#FAFAF8;color:#222;padding:30px 28px;border-radius:10px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#FF5100;font-weight:bold}
h1{font-size:22px;margin:6px 0 18px}
label{font-size:13px;color:#5A5650;display:block;margin-bottom:6px}
input{width:100%;box-sizing:border-box;padding:11px 12px;font-size:16px;border:1px solid #c9c5bd;border-radius:6px}
button{width:100%;margin-top:14px;padding:12px;font-size:15px;font-weight:bold;border:0;border-radius:6px;background:#FF5100;color:#fff;cursor:pointer}
.err{color:#C8321E;font-size:13px;margin-top:10px}
</style></head><body>
<form method="post" action="/entrar">
  <div class="eyebrow">BEC Experience Center</div>
  <h1>Reporte de ventas</h1>
  <label for="clave">Clave de acceso</label>
  <input id="clave" name="clave" type="password" autocomplete="current-password" autofocus required>
  <button type="submit">Entrar</button>
  __ERROR__
</form>
</body></html>
